[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-data-recording-agent"
version = "0.9.3"
description = "Local-first, consent-based desktop recording and dataset preparation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "pydantic==2.13.5", "numpy==2.3.5", "opencv-python-headless==4.13.0.92",
  "PyQt6==6.10.0", "PyQt6-Qt6==6.10.0", "playwright==1.57.0",
  "pynput==1.8.1", "mss==10.1.0"
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-qt==4.5.0", "pytest-cov==7.0.0", "ruff==0.14.10", "mypy==1.19.1"]
[project.scripts]
idra = "idra.app.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"idra.browser" = ["*.js"]
"idra" = ["resources/*.png"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["gui: requires PyQt6 and pytest-qt", "native: isolated X11 screen capture", "browser: local Chromium integration", "performance: measured controlled workload"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/idra"]
